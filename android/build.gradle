plugins {
    id 'com.android.library'
}

// AGP 9+ provides built-in Kotlin support, applying KGP manually is only needed for older AGP
// or when the app opts out with android.builtInKotlin=false
def agpMajorVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlinDisabled = 'false'.equalsIgnoreCase(project.findProperty('android.builtInKotlin')?.toString()?.trim())
if (agpMajorVersion < 9 || builtInKotlinDisabled) {
    pluginManager.apply('kotlin-android')
}

group 'com.tpay'
version '1.6.0'

android {
    namespace 'com.tpay'
    compileSdkVersion 35

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
        buildConfigField "String", "TPAY_FLUTTER_SDK_VERSION", "\"${project.version}\""
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation 'com.tpay:sdk:1.2.10'
    implementation 'com.android.support:support-v4:28.0.0'
}
